# =====================================================================
# EMQX overrides applied at boot (mounted into container at /opt/emqx/etc-extra).
#
# We keep most config in env vars for docker-compose, but listener/auth/rule
# config is verbose enough that a HOCON file is clearer. This file is NOT
# auto-loaded by EMQX 5.x; instead the POC scripts copy it into place via
# `emqx_ctl conf load`. Keep that command in mind when reproducing.
# =====================================================================

# ---------- Limits matching POC 01 (million connections) ----------
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1000000
  max_conn_rate = 10000      # protects against the connection-storm of POC 02
  acceptors = 32             # one acceptor per scheduler thread is a good default
  tcp_options {
    backlog = 4096
    nodelay = true
    reuseaddr = true
    keepalive = "300,30,5"   # SO_KEEPALIVE so half-open TCP gets reaped fast
  }
}

# ---------- TLS listener (POC 05 mTLS) ----------
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 500000
  ssl_options {
    keyfile = "/opt/emqx/etc-extra/certs/server.key"
    certfile = "/opt/emqx/etc-extra/certs/server.crt"
    cacertfile = "/opt/emqx/etc-extra/certs/ca.crt"
    verify = "verify_peer"        # require client cert
    fail_if_no_peer_cert = true
    versions = ["tlsv1.3", "tlsv1.2"]
    handshake_timeout = "15s"
  }
}

# ---------- Auth chain (POC 05) ----------
# EMQX tries each authenticator in order until one returns allow/deny.
# Order matters: JWT first (cheap), then mTLS CN (covered by TLS layer),
# then Postgres builtin (most expensive - one query per connect).
authentication = [
  { mechanism = "jwt"
    use_jwks = false
    algorithm = "hmac-based"
    secret = "${JWT_HMAC_SECRET:-replace-me-with-real-secret-32-bytes}"
    secret_base64_encoded = false
    verify_claims { username = "${username}" }
  },
  { mechanism = "password_based"
    backend = "postgresql"
    server = "postgres:5432"
    database = "emqx"
    username = "emqx"
    password = "emqx_pass"
    query = "SELECT password_hash, salt, is_superuser FROM mqtt_user WHERE username = ${username} LIMIT 1"
    password_hash_algorithm { name = "sha256", salt_position = "suffix" }
  }
]

# ---------- ACL (POC 05) ----------
# Default deny; allow rules come from Postgres.
authorization {
  no_match = "deny"
  deny_action = "ignore"     # log + drop, do not disconnect (avoids flap loops)
  cache { enable = true, max_size = 32, ttl = "1m" }
  sources = [
    { type = "postgresql"
      server = "postgres:5432"
      database = "emqx"
      username = "emqx"
      password = "emqx_pass"
      query = "SELECT permission, action, topic FROM mqtt_acl WHERE username = ${username}"
    }
  ]
}

# ---------- Session expiry / retained / mqueue defaults ----------
# These guard against the gotchas listed in POC 09 / 10.
mqtt {
  max_qos_allowed = 2
  max_topic_levels = 32
  max_topic_alias = 65535     # MQTT 5 topic alias (POC 07)
  retain_available = true
  shared_subscription = true  # POC 04
  session_expiry_interval = "2h"  # POC 09; default would let zombie sessions live forever
  max_mqueue_len = 1000       # POC 10 - guard against slow-consumer memory blow-up
  mqueue_default_priority = "lowest"
}

# ---------- Retainer (POC 10) ----------
retainer {
  enable = true
  backend {
    type = "built_in_database"
    storage_type = "ram"      # use "disc" for crash-safe retained; RAM is faster
    max_retained_messages = 1000000
  }
  msg_expiry_interval = "24h"  # CRITICAL - MQTT 3.1.1 has no retained TTL by default
}

# ---------- Rate-limiting (POC 02 / 14) ----------
# Per-listener and per-zone rate limits stop a single bad client from DoS-ing
# the cluster. These numbers are conservative for a single 8-core box.
limiter.bytes_rate = "10MB/s"
limiter.messages_rate = "100000/s"
limiter.connection_rate = "10000/s"
