# HAProxy in front of EMQX cluster.
#
# Two important LB choices for MQTT:
#   1. balance source - hash by source IP so the same client reconnects to the
#      same broker. This matters for persistent sessions (POC 09): if a client
#      bounces to a different node, its session table lookup goes via Mria
#      across the cluster, which is slow under storm conditions.
#   2. timeout client 4h - MQTT keepalive can be long (15 min on cellular).
#      Default 50s HTTP timeouts kill MQTT connections.
#
# We also expose stats on :8404 so the cluster POC (14) can show traffic
# steering when nodes go down.

global
    log stdout format raw local0 info
    maxconn 1000000     # match nofile ulimit; HAProxy can saturate ~1M conns
    nbthread 4

defaults
    log global
    mode tcp
    timeout connect 10s
    timeout client 4h   # match MQTT keepalive ceiling
    timeout server 4h

# ---------- MQTT TCP ----------
frontend mqtt_tcp_in
    bind *:1883
    default_backend mqtt_tcp_back

backend mqtt_tcp_back
    balance source       # sticky-by-IP for persistent sessions
    option tcp-check
    tcp-check connect
    server emqx1 emqx1.emqx.io:1883 check inter 5s
    server emqx2 emqx2.emqx.io:1883 check inter 5s
    server emqx3 emqx3.emqx.io:1883 check inter 5s

# ---------- MQTT WebSocket ----------
frontend mqtt_ws_in
    bind *:8083
    mode http
    default_backend mqtt_ws_back

backend mqtt_ws_back
    mode http
    balance source
    server emqx1 emqx1.emqx.io:8083 check
    server emqx2 emqx2.emqx.io:8083 check
    server emqx3 emqx3.emqx.io:8083 check

# ---------- Stats ----------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
