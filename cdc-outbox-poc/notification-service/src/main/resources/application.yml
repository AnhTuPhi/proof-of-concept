spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DB_USERNAME:notif}
    password: ${DB_PASSWORD:notif}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: notification-service-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  kafka:
    orders-topic: ${KAFKA_ORDERS_TOPIC:outbox.event.Order}

logging:
  level:
    root: INFO
    com.example.cdc: DEBUG
    org.apache.kafka.clients.NetworkClient: WARN
