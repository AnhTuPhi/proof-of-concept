###############################################################################
# Production-grade local stack for Kafka Patterns POC
#
# Includes:
#   - Kafka 4.0 (KRaft mode, no Zookeeper)
#   - Confluent Schema Registry 7.7
#   - Kafka Connect 7.7 with Debezium Oracle + Elasticsearch sink
#   - Oracle Database 23ai Free (for outbox + CDC)
#   - Elasticsearch 8.15 + Kibana
#   - Kafka UI for inspection
#   - Prometheus + Grafana for lag/throughput monitoring
#
# Profiles allow starting subsets:
#   docker compose --profile core up -d         # Kafka + Schema Registry + UI
#   docker compose --profile data up -d         # + Oracle + ES
#   docker compose --profile connect up -d      # + Kafka Connect
#   docker compose --profile observability up -d # + Prometheus + Grafana
#   docker compose --profile all up -d          # everything
###############################################################################

services:
  ###############################
  # Kafka 4.0 in KRaft mode
  ###############################
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    profiles: ["core", "data", "connect", "observability", "all"]
    ports:
      - "9092:9092"   # external PLAINTEXT
      - "9094:9094"   # internal docker network
    environment:
      # KRaft mode - no Zookeeper required from Kafka 4.x
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Production-leaning defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Cluster ID - generated once, baked in
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ###############################
  # Schema Registry (Avro / Protobuf)
  ###############################
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    hostname: schema-registry
    profiles: ["core", "data", "connect", "observability", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9094
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward

  ###############################
  # Kafka Connect (Debezium + ES sink)
  ###############################
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.7.1
    container_name: kafka-connect
    hostname: kafka-connect
    profiles: ["connect", "all"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9094
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    command:
      - bash
      - -c
      - |
        echo "Installing connectors..."
        confluent-hub install --no-prompt debezium/debezium-connector-oracle:2.7.3
        confluent-hub install --no-prompt confluentinc/kafka-connect-elasticsearch:14.1.2
        confluent-hub install --no-prompt confluentinc/kafka-connect-jdbc:10.8.0
        echo "Starting Kafka Connect..."
        /etc/confluent/docker/run

  ###############################
  # Kafka UI - http://localhost:8080
  ###############################
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["core", "data", "connect", "observability", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  ###############################
  # Oracle Database 23ai Free
  ###############################
  oracle:
    image: container-registry.oracle.com/database/free:23.5.0.0
    container_name: oracle
    hostname: oracle
    profiles: ["data", "connect", "all"]
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: Welcome123
      ORACLE_CHARACTERSET: AL32UTF8
      ENABLE_ARCHIVELOG: "true"   # required for Debezium / LogMiner
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/Welcome123@//localhost:1521/FREEPDB1", "as", "sysdba", "@/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  ###############################
  # Elasticsearch + Kibana
  ###############################
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    profiles: ["data", "connect", "all"]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    profiles: ["data", "connect", "all"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  ###############################
  # Observability (lag monitoring)
  ###############################
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    profiles: ["observability", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    command: ["--kafka.server=kafka:9094"]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["observability", "all"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["observability", "all"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana:/etc/grafana/provisioning

volumes:
  oracle-data:
  es-data:
