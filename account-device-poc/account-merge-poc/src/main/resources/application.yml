server:
  port: 8081

spring:
  application:
    name: account-merge-poc
  datasource:
    url: jdbc:h2:mem:mergedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2

logging:
  level:
    com.vndirect.poc.merge: INFO
