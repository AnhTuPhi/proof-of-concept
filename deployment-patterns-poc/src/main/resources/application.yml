server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: deployment-patterns-demo
  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  # Instance identity — overridden via env so we can run BLUE/GREEN side-by-side
  instance-id: ${INSTANCE_ID:blue-1}
  version: ${APP_VERSION:v1}
  color: ${COLOR:BLUE}

  # Startup probe: simulate slow warmup (cache load, schema check, ...)
  startup:
    warmup-ms: ${WARMUP_MS:3000}

  # Graceful shutdown: how long to keep readiness=DOWN before kill
  shutdown:
    drain-grace-ms: ${DRAIN_GRACE_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,downstream
        startup:
          include: warmup
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.demo.deployment: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [${app.instance-id:?}] %logger{20} - %msg%n"
