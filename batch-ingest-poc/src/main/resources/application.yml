spring:
  application:
    name: batch-ingest-poc

  # By default we connect to a local Postgres started by docker-compose.yml.
  # For embedded testing, activate the 'h2' profile.
  datasource:
    url: jdbc:postgresql://localhost:5432/batchdb
    username: batch
    password: batch
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: batch-ingest-pool
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: never
      table-prefix: BATCH_
    job:
      enabled: false   # don't auto-run jobs on startup; trigger via REST instead

server:
  port: 8080
  shutdown: graceful

# Tunables for the ingest pipeline.
ingest:
  chunk-size: 1000
  grid-size: 8                # number of partitions for parallel ingest
  thread-pool:
    core: 8
    max: 16
    queue: 1000
  skip-limit: 50              # tolerate up to N bad rows per step before failing
  csv:
    input-dir: ./data/csv
    glob: "*.csv"
    encoding: UTF-8
    skip-header: true
  parquet:
    input-dir: ./data/parquet
    glob: "*.parquet"
  db-source:
    table: source_transactions
    id-column: id
    fetch-size: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,batch
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: batch-ingest-poc

logging:
  level:
    root: INFO
    com.poc.batchingest: INFO
    org.springframework.batch: INFO
    org.apache.hadoop: WARN
    org.apache.parquet: WARN
