server:
  port: 8082

spring:
  application:
    name: wallet-concurrency-poc
  datasource:
    url: jdbc:h2:mem:wallets;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.format_sql: true
